<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로마 · 아씨시 순례 지도</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5F0E8;--card:#fff;--border:#DDD6C8;
  --text:#2C2520;--muted:#7A7060;--sub:#B8AD9E;
  --church:#7A1F1F;--food:#B5862A;--infra:#2B5BA8;
  --active-glow:0 0 0 3px rgba(255,255,255,.9),0 0 0 5px;
}
body{font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── 헤더 ── */
.hd{background:var(--card);border-bottom:1px solid var(--border);padding:10px 14px 9px;flex-shrink:0}
.hd h1{font-size:13px;font-weight:700;margin-bottom:8px}
.city-tabs{display:flex;gap:5px;margin-bottom:8px}
.city-tab{padding:4px 13px;border-radius:14px;border:1.5px solid var(--border);background:var(--bg);color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.city-tab.active{background:var(--text);color:#fff;border-color:var(--text)}
.leg-row{display:flex;gap:5px;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg);color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.leg.on-all   {background:var(--text);color:#fff;border-color:var(--text)}
.leg.on-church{background:var(--church);color:#fff;border-color:var(--church)}
.leg.on-food  {background:var(--food);color:#fff;border-color:var(--food)}
.leg.on-infra {background:var(--infra);color:#fff;border-color:var(--infra)}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ── 레이아웃 ── */
.main{display:flex;flex:1;overflow:hidden;position:relative}
#map{flex:1;height:100%}

/* ── 사이드 패널 ── */
.side{width:220px;flex-shrink:0;background:var(--card);border-left:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column}
.side-title{padding:10px 12px 6px;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);flex-shrink:0}
.place-item{padding:9px 12px;border-bottom:0.5px solid var(--border);cursor:pointer;transition:background .1s}
.place-item:hover{background:#F9F6F0}
.place-item.active-item{background:#FBF0D8;border-left:3px solid var(--food)}
.pi-cat{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:2px}
.pi-name{font-size:12px;font-weight:600;color:var(--text);line-height:1.3;margin-bottom:2px}
.pi-day{font-size:10px;color:var(--sub)}
.c-church{color:var(--church)}.c-food{color:var(--food)}.c-infra{color:var(--infra)}

/* ── 구글맵 InfoWindow 커스텀 ── */
.gm-style .gm-style-iw-c{border-radius:10px!important;padding:0!important}
.gm-style .gm-style-iw-d{overflow:hidden!important}
.pu{padding:12px 14px}
.pu-cat{font-size:9px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;margin-bottom:3px}
.pu-name{font-size:13px;font-weight:700;line-height:1.3;margin-bottom:5px;color:var(--text)}
.pu-desc{font-size:11px;color:var(--muted);line-height:1.6}
.pu-day{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;margin-top:7px}
.d-c{background:#FDE8E8;color:var(--church)}
.d-f{background:#FBF0D8;color:#8A6010}
.d-i{background:#E3EEFF;color:var(--infra)}
.pu-gmaps{display:block;margin-top:8px;font-size:10px;color:var(--infra);text-decoration:none;font-weight:600}
.pu-gmaps:hover{text-decoration:underline}

/* ── API 키 미설정 안내 배너 ── */
#keyWarn{
  display:none;position:absolute;inset:0;z-index:2000;
  background:rgba(245,240,232,.97);
  align-items:center;justify-content:center;text-align:center;padding:30px;
}
#keyWarn.show{display:flex}
#keyWarn .box{max-width:360px}
#keyWarn h2{font-size:15px;margin-bottom:10px;color:var(--text)}
#keyWarn p{font-size:12.5px;color:var(--muted);line-height:1.7;margin-bottom:8px}
#keyWarn code{background:#fff;border:1px solid var(--border);padding:2px 6px;border-radius:4px;font-size:11.5px}
#keyWarn a{color:var(--infra);font-weight:600}

/* ── 마커 커스텀 ── */
.mk-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.mk-circle{
  width:22px;height:22px;border-radius:50%;
  border:2.5px solid #fff;
  box-shadow:0 2px 6px rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;
  font-size:9px;color:#fff;font-weight:700;
  transition:transform .15s, box-shadow .15s;
}
.mk-circle.active-marker{
  transform:scale(1.5);
  box-shadow:0 0 0 3px rgba(255,255,255,.9), 0 0 0 5px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.4);
  z-index:1000;
}
.mk-label{
  background:rgba(44,37,32,.8);color:#fff;
  font-size:9px;font-weight:600;
  padding:1px 5px;border-radius:3px;
  white-space:nowrap;margin-top:2px;
  opacity:0;transition:opacity .15s;
  pointer-events:none;
}
.mk-wrap:hover .mk-label{opacity:1}

@media(max-width:600px){
  .side{display:none}
}
</style>
</head>
<body>

<div class="hd">
  <h1>✝️ 로마 · 아씨시 순례 지도</h1>
  <div class="city-tabs">
    <button class="city-tab active" onclick="setCity('rome',this)">🏛 로마</button>
    <button class="city-tab" onclick="setCity('assisi',this)">🕊 아씨시</button>
  </div>
  <div class="leg-row">
    <button class="leg on-all"    onclick="filter('all',this)"><div class="dot" style="background:#555"></div>전체</button>
    <button class="leg"           onclick="filter('church',this)"><div class="dot" style="background:var(--church)"></div>⛪ 성당·명소</button>
    <button class="leg"           onclick="filter('food',this)"><div class="dot" style="background:var(--food)"></div>🍽 식사·카페</button>
    <button class="leg"           onclick="filter('infra',this)"><div class="dot" style="background:var(--infra)"></div>🚆 숙소·교통·마트</button>
  </div>
</div>

<div class="main">
  <div id="map"></div>
  <div id="keyWarn">
    <div class="box">
      <h2>🔑 구글맵 API 키가 필요합니다</h2>
      <p>이 파일 맨 아래 스크립트에서<br><code>YOUR_GOOGLE_MAPS_API_KEY</code> 부분을<br>발급받은 키로 바꿔주세요.</p>
      <p><a href="https://console.cloud.google.com/google/maps-apis/credentials" target="_blank">→ Google Cloud Console에서 무료로 발급받기</a></p>
    </div>
  </div>
  <div class="side">
    <div class="side-title" id="sideTitle">장소 목록</div>
    <div id="placeList"></div>
  </div>
</div>

<script>
const GOOGLE_MAPS_API_KEY = 'AIzaSyDzuItgIYc81CnVL3U-AR2UA2IEKJ9Xyfc'; // ← 여기에 발급받은 키를 붙여넣으세요
</script>

<script>
const C={church:'#7A1F1F',food:'#B5862A',infra:'#2B5BA8'};

  {cat:'church',name:'콜로세움',lat:41.8902,lng:12.4922,day:'DAY 4',desc:'로마 제국 원형 경기장. 사전 예약 권장.'},

  {cat:'church',name:'산타 크로체 인 제루살렘메',lat:41.8885,lng:12.5138,day:'DAY 6',desc:'예루살렘 흙 위의 성당. 성물 경당.'},
  {cat:'church',name:'라우렌시아 (산 로렌조 인 다마소)',lat:41.8958,lng:12.4706,day:'DAY 6',desc:'4세기 기원. 나보나 광장 인근.'},
  {cat:'church',name:'빌라 보르게세 공원·갤러리',lat:41.9136,lng:12.4921,day:'DAY 6',desc:'80헥타르 공원. 베르니니·카라바조 소장.'},
  // 식사·카페
  {cat:'food',name:'뎌온다 (한식)',lat:41.9068,lng:12.4535,day:'자유',desc:'Cipro A라인역 인근 한식당.'},
  {cat:'food',name:'글루텐 프리 (San Pietro 옆)',lat:41.9024,lng:12.4562,day:'자유',desc:'바티칸 광장 옆 글루텐 프리 식당.'},
  {cat:'food',name:'산 유스타치오 카페',lat:41.8984,lng:12.4762,day:'DAY 4',desc:'판테온 옆. 로마 최고 커피 바.'},
  {cat:'food',name:'BaoBao (중국음식)',lat:41.8988,lng:12.4758,day:'자유',desc:'판테온 옆 중국 음식점.'},
  {cat:'food',name:'Bao House',lat:41.9008,lng:12.4840,day:'자유',desc:'트레비 분수 옆. 바오 전문.'},
  {cat:'food',name:'Pizza & Focaccia',lat:41.9005,lng:12.4836,day:'자유',desc:'트레비 분수 옆 피자 전문.'},
  {cat:'food',name:'La Notizia Piazzetta',lat:41.8946,lng:12.4870,day:'자유',desc:'트라야누스 시장과 모세상 사이.'},
  {cat:'food',name:'미담 (한식)',lat:41.8978,lng:12.5000,day:'자유',desc:'산타 마리아 마조레 인근.'},
  {cat:'food',name:'맘마꼬레아 (한식)',lat:41.8975,lng:12.5005,day:'DAY 2',desc:'산타 마리아 마조레 인근. DAY 2 저녁.'},
  {cat:'food',name:'Pho 1 (쌀국수)',lat:41.8985,lng:12.4930,day:'자유',desc:'산타 마리아 마조레 인근.'},
  {cat:'food',name:'POMPI (젤라또·티라미수)',lat:41.9058,lng:12.4831,day:'DAY 4',desc:'스페인 계단 근처. 1960년대부터.'},
  // 숙소·교통·마트
  {cat:'infra',name:'CIPRO (지하철 A라인)',lat:41.9071,lng:12.4538,day:'DAY 3',desc:'바티칸 인근 지하철역.'},
  {cat:'infra',name:'로마 테르미니역',lat:41.9004,lng:12.5013,day:'D1·5·8',desc:'아씨시 기차 07:43 출발. 공항↔시내.'},
  {cat:'infra',name:'콜로세오 역 (지하철 B)',lat:41.8900,lng:12.4924,day:'DAY 2',desc:'지하철 B라인.'},
  {cat:'infra',name:'AGORA (슈퍼마켓)',lat:41.9010,lng:12.4990,day:'자유',desc:'시내 중심 슈퍼마켓.'},
  {cat:'infra',name:'마켓 (마조레 인근)',lat:41.8972,lng:12.5010,day:'자유',desc:'산타 마리아 마조레 근처 마트.'},
  {cat:'infra',name:'피우미치노 공항',lat:41.7999,lng:12.2462,day:'D1·8',desc:'레오나르도 익스프레스 32분.'},
];
const ASSISI=[
  {cat:'church',name:'성 프란치스코 대성전',lat:43.0740,lng:12.6051,day:'DAY 5',desc:'조토 프레스코 28점(상원당) + 무덤(하원당).'},
  {cat:'church',name:'성 클라라 성당',lat:43.0697,lng:12.6124,day:'DAY 5',desc:'클라라 성녀 유해. 움브리아 평원 전망.'},
  {cat:'church',name:'산 루피노 대성당',lat:43.0714,lng:12.6139,day:'DAY 5',desc:'프란치스코·클라라가 세례받은 곳.'},
  {cat:'food',name:'코뮤네 광장 카페',lat:43.0707,lng:12.6119,day:'DAY 5',desc:'Piazza del Comune. 점심·커피.'},
  {cat:'infra',name:'아씨시역',lat:43.0585,lng:12.6165,day:'DAY 5',desc:'역→마을 버스: P.Matteotti 1번 / V.le G.Marconi 2번.'},
];
const CITIES={rome:ROME,assisi:ASSISI};
const VIEWS={
  rome:{center:{lat:41.896,lng:12.490},zoom:14},
  assisi:{center:{lat:43.071,lng:12.612},zoom:16}
};

// "커스텀" 탭 전용 스타일 — 흰 배경 + 굵은 도로선
const MAP_STYLE_CUSTOM=[
  {elementType:'geometry',stylers:[{color:'#ffffff'}]},
  {elementType:'labels.text.fill',stylers:[{color:'#4a4a4a'}]},
  {elementType:'labels.text.stroke',stylers:[{color:'#ffffff'}]},
  {featureType:'water',elementType:'geometry',stylers:[{color:'#cfe8f3'}]},
  {featureType:'landscape',elementType:'geometry',stylers:[{color:'#f7f7f5'}]},
  {featureType:'road',elementType:'geometry',stylers:[{color:'#2c2520'},{weight:1.8}]},
  {featureType:'road.highway',elementType:'geometry',stylers:[{color:'#B5862A'},{weight:2.6}]},
  {featureType:'road.arterial',elementType:'geometry',stylers:[{color:'#3a3128'},{weight:2}]},
  {featureType:'road.local',elementType:'geometry',stylers:[{color:'#6b6255'},{weight:1.4}]},
  {featureType:'poi',elementType:'labels',stylers:[{visibility:'off'}]},
  {featureType:'transit',elementType:'labels',stylers:[{visibility:'off'}]},
];

// ── 상태 ──
let map, infoWindow;
let curCity='rome', curFilter='all', activeMarkerKey=null;
const markerMap={}; // key → {marker, place, city, cat}

function mkIcon(cat,active=false){
  return {
    path:google.maps.SymbolPath.CIRCLE,
    fillColor:C[cat],
    fillOpacity:1,
    strokeColor:'#fff',
    strokeWeight:active?3:2.3,
    scale:active?13:8.5,
  };
}

function popupHtml(p){
  return `<div class="pu">
    <div class="pu-cat ${CCLS[p.cat]}">${LBL[p.cat]}</div>
    <div class="pu-name">${p.name}</div>
    <div class="pu-desc">${p.desc}</div>
    <span class="pu-day ${DCLS[p.cat]}">${p.day}</span>
    <a class="pu-gmaps" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name)}" target="_blank">📍 구글맵에서 열기 →</a>
  </div>`;
}

// ── 구글맵 초기화 (Maps JS API의 콜백으로 호출됨) ──
function initMap(){
  map=new google.maps.Map(document.getElementById('map'),{
    center:VIEWS.rome.center,
    zoom:VIEWS.rome.zoom,
    mapTypeId:'roadmap',                 // 지도 탭 = 구글 기본 스타일 그대로
    mapTypeControlOptions:{
      mapTypeIds:['roadmap','custom_style','satellite'],
    },
    disableDefaultUI:false,
    fullscreenControl:false,
    streetViewControl:false,
  });
  // "커스텀" 탭 등록 — 흰 배경 + 굵은 도로선 스타일을 지도/위성과 같은 자리의
  // 세 번째 탭으로 추가한다 (기존 지도 탭은 건드리지 않음)
  const customMapType=new google.maps.StyledMapType(MAP_STYLE_CUSTOM,{name:'커스텀'});
  map.mapTypes.set('custom_style',customMapType);
  infoWindow=new google.maps.InfoWindow();
  infoWindow.addListener('closeclick',()=>{
    if(activeMarkerKey&&markerMap[activeMarkerKey]){
      const {marker,cat}=markerMap[activeMarkerKey];
      marker.setIcon(mkIcon(cat,false));
    }
    activeMarkerKey=null;
    document.querySelectorAll('.place-item').forEach(el=>el.classList.remove('active-item'));
  });

  Object.entries(CITIES).forEach(([city,places])=>{
    places.forEach((p,idx)=>{
      const key=`${city}-${idx}`;
      const marker=new google.maps.Marker({
        position:{lat:p.lat,lng:p.lng},
        map:city===curCity?map:null,
        icon:mkIcon(p.cat),
        title:p.name,
      });
      marker.addListener('click',()=>activatePlace(key));
      markerMap[key]={marker,place:p,city,cat:p.cat};
    });
  });

  renderList();
}

// ── 활성화 함수 ──
function activatePlace(key){
  if(activeMarkerKey&&markerMap[activeMarkerKey]){
    const prev=markerMap[activeMarkerKey];
    prev.marker.setIcon(mkIcon(prev.cat,false));
  }
  document.querySelectorAll('.place-item').forEach(el=>el.classList.remove('active-item'));

  if(activeMarkerKey===key){
    activeMarkerKey=null;
    infoWindow.close();
    return;
  }
  activeMarkerKey=key;
  const {marker,place,cat}=markerMap[key];

  marker.setIcon(mkIcon(cat,true));
  infoWindow.setContent(popupHtml(place));
  infoWindow.open({anchor:marker,map});
  map.panTo(marker.getPosition());

  const itemEl=document.querySelector(`[data-key="${key}"]`);
  if(itemEl){
    itemEl.classList.add('active-item');
    itemEl.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
}

// ── 사이드 패널 렌더 ──
function renderList(){
  const places=CITIES[curCity];
  const list=document.getElementById('placeList');
  list.innerHTML='';
  const filtered=places.filter(p=>curFilter==='all'||p.cat===curFilter);
  document.getElementById('sideTitle').textContent=`장소 목록 (${filtered.length})`;

  const cats=curFilter==='all'?['church','food','infra']:[curFilter];
  cats.forEach(cat=>{
    const catPlaces=filtered.filter(p=>p.cat===cat);
    if(catPlaces.length===0)return;
    const header=document.createElement('div');
    header.style.cssText='padding:6px 12px 4px;font-size:9px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;background:#F5F0E8;border-bottom:0.5px solid #DDD6C8;';
    header.style.color=C[cat];
    header.textContent={church:'⛪ 성당·명소',food:'🍽 식사·카페',infra:'🚆 숙소·교통·마트'}[cat];
    list.appendChild(header);

    catPlaces.forEach(p=>{
      const origIdx=CITIES[curCity].indexOf(p);
      const key=`${curCity}-${origIdx}`;
      const div=document.createElement('div');
      div.className='place-item';
      div.dataset.key=key;
      div.innerHTML=`<div class="pi-name">${p.name}</div><div class="pi-day">${p.day}</div>`;
      div.addEventListener('click',()=>activatePlace(key));
      list.appendChild(div);
    });
  });
}

// ── 도시 전환 ──
function setCity(city,btn){
  curCity=city;
  activeMarkerKey=null;
  if(infoWindow)infoWindow.close();
  document.querySelectorAll('.city-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  applyVisibility();
  if(map){
    map.panTo(VIEWS[city].center);
    map.setZoom(VIEWS[city].zoom);
  }
  renderList();
}

// ── 카테고리 필터 ──
function filter(cat,btn){
  curFilter=cat;
  document.querySelectorAll('.leg').forEach(b=>{b.className='leg'});
  btn.classList.add('on-'+cat);
  applyVisibility();
  renderList();
}

// ── 도시+카테고리 조건에 맞는 마커만 지도에 표시 ──
function applyVisibility(){
  Object.values(markerMap).forEach(({marker,city,cat})=>{
    const show=city===curCity&&(curFilter==='all'||cat===curFilter);
    marker.setMap(show?map:null);
  });
}

// ── 구글맵 스크립트 로드 ──
if(GOOGLE_MAPS_API_KEY==='YOUR_GOOGLE_MAPS_API_KEY'){
  document.getElementById('keyWarn').classList.add('show');
}else{
  const gmScript=document.createElement('script');
  gmScript.src=`https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&callback=initMap`;
  gmScript.async=true;
  document.head.appendChild(gmScript);
}
</script>
